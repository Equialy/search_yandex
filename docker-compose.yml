  postgres:
    image: postgres:18.1
    container_name: postgres_search_yandex
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB__PG__NAME}
      POSTGRES_USER: ${DB__PG__USER}
      POSTGRES_PASSWORD: ${DB__PG__PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

    ports:
      - "${DB__PG__PORT}:5432"
    restart: "unless-stopped"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB__PG__USER} -d ${DB__PG__NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - app_network



networks:
  app_network:
    name: app_network


volumes:
  postgres-data:
